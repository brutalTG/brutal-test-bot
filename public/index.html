<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRUTAL Drop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="background.mp4" type="video/mp4">
        <source src="background.MOV" type="video/quicktime">
    </video>
    
    <div id="timer-bar-wrap"><div id="timer-bar-fill"></div></div>

    <div id="splash">
        <div class="splash-logo">BRUTAL</div>
        <div class="splash-sub">The Insight Club</div>
        <div id="splash-contract" class="splash-contract"></div>
        <div class="splash-info" id="splash-info"><strong>20</strong> preguntas · <strong>~3 min</strong></div>
        <button class="splash-enter" id="splash-btn" disabled onclick="initDrop()">ENTRAR</button>
        <div class="splash-error" id="splash-error" style="display:none"></div>
    </div>
    
    <div id="floating-hud">
        <div class="hud-side cash-side" id="box-cash"><span class="hud-val" id="val-cash">$0.00</span></div>
        <div class="hud-center"><div class="progress-track" id="pbar"></div></div>
        <div class="hud-side ticket-side" id="box-tix">
            <span class="hud-val" id="val-tix">0</span>
            <img src="golden_ticket_3d.png" class="hud-icon-img" alt="T">
        </div>
    </div>
    
    <div id="blink-fx"></div>
    <div id="timeout-overlay"><div class="timeout-text">BRUTAL<br>ELIGIÓ<br>POR VOS</div></div>
    <div id="intersticial-overlay"><div id="intersticial-text"></div></div>
    <div id="micro-reaction" class="micro-reaction"></div>
    
    <div id="card-container"></div>

<script>
const API_URL=window.location.origin;
let D=[];
let dropSlug='';
let ci=0,cash=0,tix=0,ct=0,dt=0,sid=null,ms=[],ro=[],rs=[],tgUser=null;
let slStep=-1;
let timerInterval=null,timerTimeout=null;
// Speed round state
let speedItems=[],speedIdx=0,speedResponses=[],speedItemTimer=null,speedItemStart=0;
const DEFAULT_TIMERS={binary:8,split_image:10,slider:12,multi_select:12,rank:15,trap:6,trap_silent:6,confesionario:20,speed_round:25,hot_take:8,prediction:15,complete:15};
const DEFAULT_CONTRACT="Esto es un experimento. No una encuesta. No un test. Hay marcas que pagan. Hay preguntas nuestras. No te decimos cuáles. Todo es anónimo. Solo vos sabés de vos.";

function typewriter(text,el,speed,callback){let i=0;el.textContent='';const iv=setInterval(()=>{el.textContent+=text[i];i++;if(i>=text.length){clearInterval(iv);if(callback)callback()}},speed)}

window.onload=async()=>{
    if(window.Telegram?.WebApp){const t=window.Telegram.WebApp;t.ready();t.expand();t.setHeaderColor('#000000');t.setBackgroundColor('#000000');if(t.initDataUnsafe?.user)tgUser=t.initDataUnsafe.user}
    try{
        const r=await fetch(API_URL+'/api/drop/active');
        if(!r.ok)throw new Error('No active drop');
        const drop=await r.json();
        D=drop.cards;
        dropSlug=drop.slug||drop.id;
        document.getElementById('splash-info').innerHTML='<strong>'+D.length+'</strong> preguntas · <strong>~3 min</strong>';
        const contractText=(drop.splash_text&&drop.splash_text.contract)||DEFAULT_CONTRACT;
        setTimeout(()=>{typewriter(contractText,document.getElementById('splash-contract'),30,()=>{document.getElementById('splash-btn').disabled=false})},500);
    }catch(e){
        console.error('Failed to load drop:',e);
        document.getElementById('splash-error').style.display='block';
        document.getElementById('splash-error').textContent='No hay un Drop activo. Volvé más tarde.';
        document.getElementById('splash-contract').textContent='';
    }
};

async function initDrop(){
    if(D.length===0)return;
    hapHeavy();
    const sp=document.getElementById('splash');sp.classList.add('hide');
    setTimeout(()=>sp.style.display='none',500);
    document.getElementById('floating-hud').classList.add('visible');
    const pb=document.getElementById('pbar');
    for(let i=0;i<D.length;i++){const l=document.createElement('div');l.className='step-led';pb.appendChild(l)}
    try{
        const r=await fetch(API_URL+'/api/session/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_user:tgUser||{id:0},drop_id:dropSlug,device:{platform:window.Telegram?.WebApp?.platform||'unknown',version:window.Telegram?.WebApp?.version||'unknown'}})});
        const j=await r.json();
        if(r.status===409){alert(j.message||'Ya jugaste este Drop');window.Telegram?.WebApp?.close();return}
        sid=j.session_id;
    }catch(e){console.error('Session start failed:',e);sid='local_'+Date.now()}
    dt=Date.now();updHUD();render(0);
}

// ============ HAPTICS ============
function hapLight(){window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light')}
function hapMedium(){window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('medium')}
function hapHeavy(){window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('heavy')}
function hapErr(){window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('error')}
function hapOk(){window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('success')}
function hapSel(){window.Telegram?.WebApp?.HapticFeedback?.selectionChanged()}
function hapSl(v,mn,mx){const s=Math.floor((v-mn)/((mx-mn)/20));if(s!==slStep){slStep=s;hapSel()}}

// ============ TIMER ============
function clearTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}if(timerTimeout){clearTimeout(timerTimeout);timerTimeout=null}}
function startTimer(d){
    clearTimer();const fill=document.getElementById('timer-bar-fill');if(!fill)return;
    const duration=(d.timer||DEFAULT_TIMERS[d.f]||10)*1000;const startTime=Date.now();
    let warnedAt25=false,warned3=false,warned2=false,warned1=false;
    fill.style.transition='none';fill.style.width='100%';fill.classList.remove('warning');
    ct=Date.now();
    timerInterval=setInterval(()=>{
        const elapsed=Date.now()-startTime;const remaining=duration-elapsed;const pct=Math.max(0,(remaining/duration)*100);
        fill.style.width=pct+'%';
        if(pct<=25&&!warnedAt25){warnedAt25=true;fill.classList.add('warning')}
        const remSec=Math.ceil(remaining/1000);
        if(remSec<=3&&remSec>=1){if(remSec===3&&!warned3){warned3=true;hapSel()}if(remSec===2&&!warned2){warned2=true;hapSel()}if(remSec===1&&!warned1){warned1=true;hapSel()}}
        if(remaining<=0){clearTimer();fill.style.width='0%';handleTimeout(d,duration)}
    },50);
}
function handleTimeout(d,duration){
    hapErr();setTimeout(()=>hapHeavy(),100);rec(d.id,d.f,'timeout',null,duration);
    const overlay=document.getElementById('timeout-overlay');overlay.classList.add('active');
    setTimeout(()=>{overlay.classList.remove('active');const inner=document.getElementById('card-inner');if(inner)inner.classList.add('anim-out');setTimeout(()=>{render(ci+1)},300)},1000);
}

// ============ RECORDING ============
function rec(cardId,fmt,val,trap=null,overrideLatency=null){
    const lat=overrideLatency!==null?overrideLatency:Date.now()-ct;
    const row={session_id:sid,card_id:cardId,card_format:fmt,response_value:val,latency_ms:lat,trap_passed:trap};
    if(sid&&!sid.startsWith('local_')){fetch(API_URL+'/api/response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)}).catch(e=>console.error('Save failed:',e))}
    console.log('REC:',row);
}

// ============ RENDER ============
function render(i){
    ci=i;const c=document.getElementById('card-container');const d=D[i];
    if(!d){renderReceipt(c);return}
    ct=Date.now();slStep=-1;
    
    // Reset card container bg for hot_take
    c.style.background='transparent';
    c.className='';
    
    const isConf=d.f==='confesionario';
    const isDeep=d.f==='confesionario'||d.f==='complete';
    document.getElementById('bg-video').style.opacity=isDeep?'0':'0.4';
    if(isConf)c.style.background='#000';
    
    // Hot take background
    if(d.f==='hot_take'&&d.bg_color){
        const bgMap={'#E8FF00':'ht-bg-yellow','#FF0040':'ht-bg-red','#0D1117':'ht-bg-darkblue'};
        c.className=bgMap[d.bg_color]||'';
        if(bgMap[d.bg_color])c.style.background='';
    }
    
    if(!isDeep){const hud=document.getElementById('floating-hud');hud.style.transition='opacity 0.5s';hud.style.opacity='1'}
    
    let h='<div id="card-inner">';
    h+='<div class="cn anim-in">'+(i+1)+' / '+D.length+'</div>';
    
    // Don't show .cq for formats that handle their own text
    if(d.f!=='confesionario'&&d.f!=='speed_round'&&d.f!=='hot_take'&&d.f!=='prediction'&&d.f!=='complete'){
        h+='<div class="cq anim-in">'+d.q+'</div>';
    }
    
    switch(d.f){
        case 'binary':
            h+='<div class="bc">';
            d.o.forEach((o,j)=>{h+='<button class="tb anim-in d'+(j+1)+'" onclick="hBin(\''+d.id+'\',\''+o.id+'\',this,\''+d.r.t+'\','+d.r.m+')">'+o.l+'</button>'});
            h+='</div>';break;
            
        case 'multi_select':
            ms=[];
            h+='<div class="bc">';
            d.o.forEach((o,j)=>{h+='<button id="ms-'+o.id+'" class="tb anim-in d'+Math.min(j+1,4)+'" onclick="tMS(\''+o.id+'\')">'+o.l+'</button>'});
            h+='</div><button id="msc" class="cb anim-in d4" disabled onclick="hMS(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')">Confirmar</button>';break;
            
        case 'slider':
            const mid=Math.round((d.c.max+d.c.min)/2);
            h+='<div class="slc anim-in d1"><div class="sv" id="svd">'+mid+'</div><input type="range" id="sli" min="'+d.c.min+'" max="'+d.c.max+'" value="'+mid+'" step="1" oninput="updSl(this.value,'+d.c.min+','+d.c.max+')"><div class="sll"><span>'+d.c.lb[0]+'</span><span>'+d.c.lb[1]+'</span></div></div><button class="cb anim-in d2" onclick="hSl(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')">Confirmar</button>';break;
            
        case 'split_image':
            h+='<div class="sic anim-in d1">';
            d.o.forEach(o=>{h+='<div class="io" onclick="hImg(\''+d.id+'\',\''+o.id+'\',this,\''+d.r.t+'\','+d.r.m+')"><img src="'+o.img+'" loading="eager"><div class="il">'+o.l+'</div></div>'});
            h+='</div>';break;
            
        case 'rank':
            ro=[...d.o];rs=[];
            h+='<div class="rzt anim-in d1" id="rkt"></div><div class="rzb anim-in d2" id="rkb"></div><button id="rkc" class="cb anim-in d3" disabled onclick="hRk(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')">Confirmar Orden</button>';break;
            
        case 'trap':
            h+='<div class="bc">';
            d.o.forEach((o,j)=>{h+='<button class="tb anim-in d'+(j+1)+'" onclick="hTrap(\''+d.id+'\',\''+o.id+'\',\''+d.tt+'\','+d.ip+','+d.r.m+','+d.p.m+')">'+o.l+'</button>'});
            h+='</div>';break;
            
        case 'trap_silent':
            h+='<div class="bc">';
            d.o.forEach((o,j)=>{h+='<button class="tb anim-in d'+(j+1)+'" onclick="hTS(\''+d.id+'\',\''+o.id+'\',\''+d.r.t+'\','+d.r.m+')">'+o.l+'</button>'});
            h+='</div>';break;
            
        case 'confesionario':
            const hud=document.getElementById('floating-hud');hud.style.transition='opacity 0.5s';hud.style.opacity='0';
            h+='<div class="cq" id="conf-q" style="opacity:0;margin-bottom:10px"></div>';
            h+='<input type="text" class="conf-input anim-in d2" id="cinp" placeholder="Escribí acá..." autocomplete="off" maxlength="100" style="opacity:0">';
            h+='<button class="cb anim-in d3" id="conf-btn" onclick="hConf(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')" style="opacity:0">Enviar</button>';break;
        
        // ============ NEW FORMATS ============
        
        case 'speed_round':
            h+='<div class="cq anim-in" style="font-size:16px;color:#888;margin-bottom:15px">'+d.q+'</div>';
            h+='<div id="speed-stimulus" class="speed-stimulus"></div>';
            h+='<div id="speed-counter" class="speed-counter"></div>';
            h+='<div class="speed-btns" id="speed-btns"></div>';
            h+='<div class="speed-progress" id="speed-dots"></div>';
            h+='<div class="speed-timer" id="speed-timer-bar"><div class="speed-timer-fill" id="speed-timer-fill"></div></div>';
            break;
            
        case 'hot_take':
            h+='<div class="ht-card">';
            h+='<div class="ht-statement anim-in" id="ht-text"></div>';
            h+='<div class="ht-btns" id="ht-btns" style="opacity:0">';
            d.o.forEach((o,j)=>{h+='<button class="tb anim-in" onclick="hHotTake(\''+d.id+'\',\''+o.id+'\',this,\''+d.r.t+'\','+d.r.m+')">'+o.l+'</button>'});
            h+='</div></div>';
            break;
            
        case 'prediction':
            h+='<div class="pred-label anim-in">PREDICCIÓN</div>';
            h+='<div class="pred-event anim-in d1">'+d.event+'</div>';
            h+='<div class="cq anim-in d1" style="font-size:16px;color:#888;margin:10px 0 20px">'+d.q+'</div>';
            h+='<div class="pred-btns" id="pred-btns">';
            d.o.forEach((o,j)=>{h+='<button class="tb anim-in d'+(j+1)+'" id="pred-'+o.id+'" onclick="hPredDir(\''+o.id+'\')">'+o.l+'</button>'});
            h+='</div>';
            h+='<div id="pred-bet" style="display:none"></div>';
            break;
            
        case 'complete':
            const hudC=document.getElementById('floating-hud');hudC.style.transition='opacity 0.5s';hudC.style.opacity='0';
            document.getElementById('bg-video').style.opacity='0';
            c.style.background='#000';
            const parts=d.q.split('___');
            h+='<div class="comp-phrase anim-in">'+(parts[0]||'')+'<span class="comp-blank">___</span>'+(parts[1]||'')+'</div>';
            const maxC=d.max_chars||30;
            h+='<input type="text" class="comp-input anim-in d1" id="comp-inp" placeholder="..." autocomplete="off" maxlength="'+maxC+'">';
            h+='<div class="comp-chars anim-in d1"><span id="comp-count">0</span>/'+maxC+'</div>';
            h+='<button class="cb anim-in d2" id="comp-btn" onclick="hComplete(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')">Enviar</button>';
            break;
    }
    
    h+='</div>';c.innerHTML=h;void c.offsetWidth;
    
    // Post-render init for specific formats
    if(d.f==='rank')updRk();
    
    if(d.f==='confesionario'){
        setTimeout(()=>{const qEl=document.getElementById('conf-q');if(!qEl)return;qEl.style.transition='opacity 0.3s';qEl.style.opacity='1';typewriter(d.q,qEl,30,()=>{const inp=document.getElementById('cinp');const btn=document.getElementById('conf-btn');if(inp){inp.style.transition='opacity 0.3s';inp.style.opacity='1'}if(btn){btn.style.transition='opacity 0.3s';btn.style.opacity='1'}setTimeout(()=>document.getElementById('cinp')?.focus(),200);startTimer(d)})},800);
    } else if(d.f==='speed_round'){
        // Init speed round — no global timer, uses per-item timer
        clearTimer();
        document.getElementById('timer-bar-fill').style.width='0%';
        speedItems=d.items||[];
        speedIdx=0;
        speedResponses=[];
        // Build dots
        const dotsEl=document.getElementById('speed-dots');
        dotsEl.innerHTML=speedItems.map((_,i)=>'<div class="speed-dot" id="sdot-'+i+'"></div>').join('');
        // Build buttons (same for all items)
        if(speedItems.length>0){
            const btnsEl=document.getElementById('speed-btns');
            const firstItem=speedItems[0];
            btnsEl.innerHTML=firstItem.o.map(o=>'<button class="tb" onclick="hSpeedTap(\''+o.id+'\')">'+o.l+'</button>').join('');
        }
        setTimeout(()=>renderSpeedItem(),300);
    } else if(d.f==='hot_take'){
        // Typewriter the statement, then show buttons
        clearTimer();
        const stEl=document.getElementById('ht-text');
        const stmt=d.statement||d.q;
        typewriter(stmt,stEl,40,()=>{
            const btns=document.getElementById('ht-btns');
            btns.style.transition='opacity 0.3s';
            btns.style.opacity='1';
            startTimer(d);
        });
    } else if(d.f==='prediction'){
        // Prediction starts with direction choice, timer runs
        window._predDir=null;
        setTimeout(()=>startTimer(d),100);
    } else if(d.f==='complete'){
        const inp=document.getElementById('comp-inp');
        inp.addEventListener('input',()=>{
            document.getElementById('comp-count').textContent=inp.value.length;
        });
        setTimeout(()=>{inp.focus();startTimer(d)},400);
    } else {
        setTimeout(()=>startTimer(d),100);
    }
}

// ============ EXISTING HANDLERS ============
function hBin(cid,oid,btn,rt,rm){clearTimer();hapLight();btn.classList.add('sel');rec(cid,'binary',oid);reward(rt,rm);advWithReaction(600)}
function hImg(cid,oid,el,rt,rm){clearTimer();hapLight();el.classList.add('sel');rec(cid,'split_image',oid);reward(rt,rm);advWithReaction(600)}
function tMS(id){hapLight();const b=document.getElementById('ms-'+id);if(ms.includes(id)){ms=ms.filter(x=>x!==id);b.classList.remove('sel')}else{ms.push(id);b.classList.add('sel')}document.getElementById('msc').disabled=ms.length===0}
function hMS(cid,rt,rm){clearTimer();hapMedium();rec(cid,'multi_select',[...ms]);reward(rt,rm);advWithReaction(500)}
function updSl(v,mn,mx){document.getElementById('svd').textContent=v;hapSl(v,mn,mx)}
function hSl(cid,rt,rm){clearTimer();hapMedium();rec(cid,'slider',parseInt(document.getElementById('sli').value));reward(rt,rm);advWithReaction(500)}
function hRk(cid,rt,rm){clearTimer();hapMedium();rec(cid,'rank',rs.map(o=>o.id));reward(rt,rm);advWithReaction(500)}
function hTrap(cid,sel,tgt,isP,rm,pm){clearTimer();let ok=isP?(sel!==tgt):(sel===tgt);rec(cid,'trap',sel,ok);if(ok){hapOk();reward('tickets',rm);advWithReaction(600)}else{hapErr();tix+=pm;updHUD();blink(pm,'tickets',false);advWithReaction(700)}}
function hTS(cid,sel,rt,rm){clearTimer();hapLight();rec(cid,'trap_silent',sel,null);reward(rt,rm);advWithReaction(600)}
function hConf(cid,rt,rm){const inp=document.getElementById('cinp');const v=inp.value.trim();if(!v){inp.style.borderColor='#F44336';return}clearTimer();hapMedium();rec(cid,'confesionario',v);reward(rt,rm);inp.classList.add('conf-burn');const confBtn=document.getElementById('conf-btn');if(confBtn)confBtn.style.display='none';setTimeout(()=>{inp.style.display='none';const saved=document.createElement('div');saved.className='conf-saved';saved.textContent='GUARDADO';const inner=document.getElementById('card-inner');if(inner)inner.appendChild(saved);setTimeout(()=>{const hud=document.getElementById('floating-hud');hud.style.opacity='1';advWithReaction(300)},500)},800)}

// ============ NEW: SPEED ROUND ============
function renderSpeedItem(){
    if(speedIdx>=speedItems.length){
        // Done — record all and advance
        const d=D[ci];
        rec(d.id,'speed_round',speedResponses);
        reward(d.r.t,d.r.m);
        advWithReaction(500);
        return;
    }
    const item=speedItems[speedIdx];
    const stimEl=document.getElementById('speed-stimulus');
    const counterEl=document.getElementById('speed-counter');
    
    // Update stimulus
    stimEl.textContent=item.stimulus;
    stimEl.style.animation='none';
    void stimEl.offsetWidth;
    stimEl.style.animation='stimulusPop .25s cubic-bezier(.16,1,.3,1) forwards';
    
    counterEl.textContent=(speedIdx+1)+' / '+speedItems.length;
    
    // Update dots
    for(let j=0;j<speedItems.length;j++){
        const dot=document.getElementById('sdot-'+j);
        if(!dot)continue;
        dot.className='speed-dot'+(j<speedIdx?' done':'')+(j===speedIdx?' active':'');
    }
    
    // Per-item timer
    const itemTime=(D[ci].item_timer||4)*1000;
    speedItemStart=Date.now();
    const fill=document.getElementById('speed-timer-fill');
    fill.style.transition='none';fill.style.width='100%';
    void fill.offsetWidth;
    fill.style.transition='width '+itemTime+'ms linear';
    fill.style.width='0%';
    
    hapLight();
    
    if(speedItemTimer)clearTimeout(speedItemTimer);
    speedItemTimer=setTimeout(()=>{
        // Timeout this item
        speedResponses.push({id:item.id,response:'timeout',latency_ms:itemTime});
        hapErr();
        speedIdx++;
        renderSpeedItem();
    },itemTime);
}

function hSpeedTap(oid){
    if(speedIdx>=speedItems.length)return;
    if(speedItemTimer)clearTimeout(speedItemTimer);
    const lat=Date.now()-speedItemStart;
    const item=speedItems[speedIdx];
    speedResponses.push({id:item.id,response:oid,latency_ms:lat});
    hapLight();
    
    // Flash selected button briefly
    const dot=document.getElementById('sdot-'+speedIdx);
    if(dot)dot.className='speed-dot done';
    
    speedIdx++;
    setTimeout(()=>renderSpeedItem(),150);
}

// ============ NEW: HOT TAKE ============
function hHotTake(cid,oid,btn,rt,rm){
    clearTimer();hapMedium();
    btn.classList.add('sel');
    rec(cid,'hot_take',oid);
    reward(rt,rm);
    advWithReaction(600);
}

// ============ NEW: PREDICTION ============
function hPredDir(oid){
    if(window._predDir)return; // already chose
    window._predDir=oid;
    hapMedium();
    
    // Highlight selected
    const d=D[ci];
    d.o.forEach(o=>{
        const btn=document.getElementById('pred-'+o.id);
        if(o.id===oid)btn.classList.add('sel');
        else{btn.style.opacity='0.3';btn.style.pointerEvents='none'}
    });
    
    // Check if this card has bet
    if(d.bet){
        clearTimer(); // pause main timer during bet
        const betWrap=document.getElementById('pred-bet');
        const mn=d.bet.min||5;const mx=d.bet.max||50;const defBet=Math.round((mn+mx)/2);
        betWrap.innerHTML='<div class="pred-bet-wrap"><div class="pred-bet-label">¿Cuántos tickets apostás?</div><div class="pred-bet-val" id="pred-bet-val">'+defBet+'</div><input type="range" class="pred-bet-range" id="pred-bet-sli" min="'+mn+'" max="'+mx+'" value="'+defBet+'" step="5" oninput="updPredBet(this.value)"><button class="cb" style="margin-top:15px" onclick="hPredConfirm(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')">APOSTAR</button></div>';
        betWrap.style.display='block';
    } else {
        // No bet — just record and advance
        rec(d.id,'prediction',{direction:oid,bet:null});
        reward(d.r.t,d.r.m);
        advWithReaction(600);
    }
}

function updPredBet(v){
    document.getElementById('pred-bet-val').textContent=v;
    hapSel();
}

function hPredConfirm(cid,rt,rm){
    clearTimer();
    const betVal=parseInt(document.getElementById('pred-bet-sli').value);
    hapHeavy();
    rec(cid,'prediction',{direction:window._predDir,bet:betVal});
    reward(rt,rm);
    advWithReaction(600);
}

// ============ NEW: COMPLETE ============
function hComplete(cid,rt,rm){
    const inp=document.getElementById('comp-inp');
    const v=inp.value.trim();
    if(!v){inp.style.borderColor='#F44336';return}
    clearTimer();hapMedium();
    rec(cid,'complete',v);
    reward(rt,rm);
    // Burn effect like confesionario
    inp.classList.add('conf-burn');
    document.getElementById('comp-btn').style.display='none';
    setTimeout(()=>{
        inp.style.display='none';
        const saved=document.createElement('div');saved.className='conf-saved';saved.textContent='GUARDADO';
        const inner=document.getElementById('card-inner');if(inner)inner.appendChild(saved);
        setTimeout(()=>{
            const hud=document.getElementById('floating-hud');hud.style.opacity='1';
            advWithReaction(300);
        },500);
    },800);
}

// ============ RANKING ============
function tapRk(id){hapLight();if(rs.find(s=>s.id===id))rs=rs.filter(s=>s.id!==id);else rs.push(ro.find(o=>o.id===id));updRk()}
function updRk(){const t=document.getElementById('rkt'),b=document.getElementById('rkb'),c=document.getElementById('rkc');t.innerHTML=rs.map((o,i)=>'<div class="ri p'+i+'" onclick="tapRk(\''+o.id+'\')"> #'+(i+1)+' — '+o.l+'</div>').join('');b.innerHTML=ro.filter(o=>!rs.find(s=>s.id===o.id)).map(o=>'<div class="ri" onclick="tapRk(\''+o.id+'\')">'+o.l+'</div>').join('');c.disabled=rs.length!==ro.length}

// ============ REWARDS & UI ============
function reward(t,m){if(t==='tickets'){tix+=m;blink(m,'tickets',true);bump('box-tix')}else{cash+=m;blink(m,'cash',true);bump('box-cash')}updHUD()}

function advWithReaction(dl){
    clearTimer();led(ci);
    const d=D[ci];
    
    // Show micro-reaction if present
    if(d&&d.reaction){
        showReaction(d.reaction);
    }
    
    const inner=document.getElementById('card-inner');
    if(inner)inner.classList.add('anim-out');
    
    if(d&&d.intersticial){
        const reactionDelay=d.reaction?800:0;
        setTimeout(()=>{
            showIntersticial(d.intersticial,()=>{render(ci+1)});
        },dl+reactionDelay);
    } else {
        const reactionDelay=d&&d.reaction?600:0;
        setTimeout(()=>render(ci+1),dl+reactionDelay);
    }
}

function showReaction(text){
    const el=document.getElementById('micro-reaction');
    el.textContent=text;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
}

function showIntersticial(inter,callback){
    const overlay=document.getElementById('intersticial-overlay');
    const textEl=document.getElementById('intersticial-text');
    
    // Reset classes
    overlay.className='';
    overlay.id='intersticial-overlay';
    
    // Apply tipo-specific background
    overlay.classList.add('bg-'+(inter.tipo||'provocador'));
    
    textEl.textContent=inter.texto;
    textEl.className='inter-'+(inter.tipo||'provocador');
    
    overlay.classList.add('active');
    hapSel();
    
    const duration=inter.tipo==='criptico'?3500:inter.tipo==='sincero'?3000:inter.tipo==='dato'?3000:inter.tipo==='standup'?3000:2000;
    setTimeout(()=>{overlay.classList.remove('active');setTimeout(callback,200)},duration);
}

function updHUD(){document.getElementById('val-cash').textContent='$'+cash.toFixed(2);document.getElementById('val-tix').textContent=tix}
function bump(id){const e=document.getElementById(id);e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),150)}
function led(i){const l=document.querySelectorAll('.step-led');if(!l[i])return;const h=240-(i/(D.length-1)*240);const col='hsl('+h+',100%,50%)';l[i].classList.add('active');l[i].style.backgroundColor=col;l[i].style.color=col}
function blink(m,t,pos){const f=document.getElementById('blink-fx');let tx=t==='cash'?(pos?'+$'+m.toFixed(2):'-$'+Math.abs(m).toFixed(2)):(pos?'+'+m:''+m);f.innerHTML=t==='tickets'?'<span style="display:flex;align-items:center;gap:10px">'+tx+' <img src="golden_ticket_3d.png" style="width:50px"></span>':tx;f.classList.remove('blink-g','blink-r');void f.offsetWidth;f.classList.add(pos?'blink-g':'blink-r')}

// ============ RECEIPT ============
function renderReceipt(c){clearTimer();document.getElementById('floating-hud').style.display='none';document.getElementById('bg-video').style.opacity='.3';c.style.background='transparent';c.className='';const dur=Math.round((Date.now()-dt)/1000);const min=Math.floor(dur/60);const sec=dur%60;c.innerHTML='<div class="rc anim-in"><div class="rt">DROP COMPLETADO</div><div class="rv">$'+cash.toFixed(2)+'</div><div class="rtb"><img src="golden_ticket_3d.png" style="width:40px"><div class="rtv">'+tix+' tickets</div></div><div class="rs">Tiempo: '+min+'m '+sec+'s</div><button class="rcl" id="clbtn" onclick="finish()">RECLAMAR TODO</button></div>'}
async function finish(){const btn=document.getElementById('clbtn');btn.textContent='ENVIANDO...';btn.classList.add('sending');if(sid&&!sid.startsWith('local_')){try{await fetch(API_URL+'/api/session/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,totals:{cash,tickets:tix,trap_score:0,trap_total:0,duration_ms:Date.now()-dt}})})}catch(e){console.error(e)}}hapOk();btn.textContent='✓ RECLAMADO';btn.style.background='#E8FF00';btn.style.color='#000';setTimeout(()=>{window.Telegram?.WebApp?.close()},1200)}
</script>
</body>
</html>
