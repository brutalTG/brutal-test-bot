<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRUTAL Drop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#fff;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
        
        /* VIDEO BACKGROUND CON OPACIDAD 0.3 */
        #bg-video{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:-3;opacity:0.3;pointer-events:none}
        
        /* ====== SPLASH ====== */
        #splash{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;transition:opacity .5s}
        #splash.hide{opacity:0;pointer-events:none}
        .splash-logo{font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;color:#fff;margin-bottom:8px;text-shadow:0 0 40px rgba(232,255,0,.3)}
        .splash-sub{font-size:13px;letter-spacing:6px;color:#E8FF00;text-transform:uppercase;margin-bottom:20px;opacity:.8}
        .splash-contract{font-size:15px;color:#888;max-width:300px;text-align:center;line-height:1.6;margin:20px 0 25px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:120px}
        .splash-info{font-size:14px;color:#888;margin-bottom:8px}.splash-info strong{color:#fff}
        .splash-enter{background:#E8FF00;color:#000;border:none;border-radius:40px;padding:18px 60px;font-size:18px;font-weight:900;letter-spacing:2px;cursor:pointer;text-transform:uppercase;transition:transform .1s;margin-top:30px}
        .splash-enter:active:not(:disabled){transform:scale(.95)}
        .splash-enter:disabled{background:#333;color:#666;cursor:not-allowed}
        .splash-error{font-size:13px;color:#F44336;margin-top:15px;max-width:280px;text-align:center}
        
        /* ====== HUD ====== */
        #floating-hud{position:fixed;top:25px;left:50%;transform:translateX(-50%);width:92%;max-width:380px;z-index:20;background:rgba(30,30,30,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:40px;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.05);display:none;align-items:center;justify-content:space-between;padding:10px 18px;transition:opacity 0.5s}
        #floating-hud.visible{display:flex}
        .hud-side{display:flex;align-items:center;min-width:65px;transition:transform .15s}
        .cash-side{justify-content:flex-start}.ticket-side{justify-content:flex-end;gap:6px}
        .hud-val{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;background:linear-gradient(180deg,#fff 0%,#d4d4d4 50%,#f4f4f4 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
        .hud-icon-img{width:26px;height:auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
        .hud-center{flex-grow:1;margin:0 15px;display:flex;align-items:center}
        .progress-track{display:flex;gap:2px;width:100%;height:8px;background:rgba(0,0,0,.6);border-radius:10px;padding:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
        .step-led{flex:1;background:rgba(255,255,255,.05);border-radius:2px;transition:all .3s}
        .step-led.active{box-shadow:0 0 8px currentColor}
        .bump{transform:scale(1.3)}
        
        /* ====== ANIMATIONS ====== */
        @keyframes slideUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes fadeOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.95)}}
        .anim-in{animation:slideUp .5s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
        .anim-out{animation:fadeOut .3s cubic-bezier(.16,1,.3,1) forwards}
        .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}
        
        /* ====== BLINK FX ====== */
        #blink-fx{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Bebas Neue',sans-serif;font-size:90px;letter-spacing:4px;opacity:0;pointer-events:none;z-index:9999;text-shadow:0 5px 20px rgba(0,0,0,.8)}
        @keyframes blink{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
        .blink-g{animation:blink .6s ease-out forwards;color:#4CAF50}.blink-r{animation:blink .6s ease-out forwards;color:#F44336}
        
        /* ====== CARD ====== */
        #card-container{flex-grow:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:90px 20px 40px;text-align:center;width:100%;position:relative;overflow-y:auto;height:100vh}
        #card-inner{display:flex;flex-direction:column;align-items:center;width:100%;max-width:340px}
        
        /* PREGUNTAS LEGIBLES */
        .cq{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:500;font-size:22px;letter-spacing:-0.5px;margin-bottom:16px;line-height:1.35;text-shadow:0 0px 10px rgba(0,0,0,.9);color:#fcfcfc}
        
        .cn{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#E8FF00;letter-spacing:3px;margin-bottom:12px;opacity:.8}
        .bc{display:flex;flex-direction:column;gap:12px;width:100%}
        
        /* BOTONES LEGIBLES */
        .tb{background:rgba(25,25,25,.85);backdrop-filter:blur(8px);color:#fff;border:2px solid #444;border-radius:16px;padding:18px 16px;font-size:16px;font-weight:500;line-height:1.2;cursor:pointer;transition:all .15s}
        .tb:active{transform:scale(.95);background:rgba(50,50,50,.9)}
        .tb.sel{background:#E8FF00!important;color:#000!important;border-color:#E8FF00!important;transform:scale(.95)}
        
        .sic{display:flex;flex-direction:column;gap:10px;width:100%;height:50vh}
        .io{flex:1;position:relative;border-radius:16px;overflow:hidden;cursor:pointer;border:2px solid #444;transition:transform .1s,border-color .1s;background:#111}
        .io:active{transform:scale(.97)}.io.sel{border-color:#E8FF00}
        .io img{width:100%;height:100%;object-fit:cover}
        .il{position:absolute;bottom:0;left:0;width:100%;padding:15px;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,0) 100%);font-size:16px;font-weight:800;text-align:left}
        .slc{width:100%;margin:30px 0}
        input[type=range]{-webkit-appearance:none;width:100%;height:18px;border-radius:10px;background:linear-gradient(to right,#007AFF,#a64dff,#FF3B30);outline:none}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.6);border:2px solid #ddd}
        .sll{display:flex;justify-content:space-between;font-size:14px;color:#ccc;font-weight:700;margin-top:15px}
        .sv{font-family:'Bebas Neue',sans-serif;font-size:56px;color:#E8FF00;margin:15px 0;letter-spacing:2px}
        .cb{background:#E8FF00;color:#000;border:none;border-radius:30px;padding:16px 40px;font-size:18px;font-weight:900;cursor:pointer;width:100%;margin-top:20px;transition:transform .1s}
        .cb:active:not(:disabled){transform:scale(.95)}.cb:disabled{background:rgba(51,51,51,.8);color:#555}
        input[type=text]{width:100%;padding:15px;background:rgba(25,25,25,.85);border:2px solid #444;border-radius:12px;color:#fff;font-size:18px;font-weight:600;text-align:center;margin-bottom:10px}
        input[type=text]:focus{outline:none;border-color:#E8FF00}input[type=text]::placeholder{color:#666;font-weight:500}
        .rzt{display:flex;flex-direction:column;gap:10px;width:100%;min-height:160px;margin-bottom:15px}
        .rzb{display:flex;flex-direction:column;gap:10px;width:100%;padding-top:15px;border-top:2px dashed #444}
        .ri{background:rgba(25,25,25,.85);backdrop-filter:blur(8px);color:#fff;border:2px solid #444;border-radius:12px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
        .ri.p0{background:#E8FF00;color:#000;border-color:#E8FF00}
        .ri.p1{background:rgba(232,255,0,.5);color:#000;border-color:rgba(232,255,0,.6)}
        .ri.p2{background:rgba(232,255,0,.25);color:#fff;border-color:rgba(232,255,0,.3)}
        .ri.p3{background:rgba(232,255,0,.1);color:#aaa;border-color:rgba(232,255,0,.15)}
        
        /* ====== RECEIPT ====== */
        .rc{padding:30px;text-align:center}
        .rt{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;margin-bottom:20px}
        .rv{font-family:'Bebas Neue',sans-serif;font-size:60px;color:#4CAF50;margin:10px 0;letter-spacing:1px}
        .rtb{display:flex;align-items:center;justify-content:center;background:rgba(232,255,0,.1);border:1px solid rgba(232,255,0,.4);border-radius:16px;padding:20px;margin:20px 0}
        .rtv{font-family:'Bebas Neue',sans-serif;font-size:36px;color:#E8FF00;margin-left:12px;letter-spacing:1px}
        .rs{font-size:14px;font-weight:600;color:#888;margin-bottom:30px}
        .rcl{background:#4CAF50;color:#fff;border:none;border-radius:30px;padding:18px 40px;font-size:18px;font-weight:900;cursor:pointer;width:100%;letter-spacing:1px}
        .rcl:active{transform:scale(.95)}.rcl.sending{background:#555;pointer-events:none}
        
        /* ====== PIEZA 1: TIMER (ANSIEDAD PERIFÉRICA) ====== */
        #timer-bar-wrap{position:fixed;top:0;left:0;width:100vw;height:10px;background:rgba(255,255,255,.05);z-index:9999;overflow:hidden}
        #timer-bar-fill{height:100%;width:100%;background:#E8FF00;box-shadow:0 0 12px rgba(232,255,0,0.6);transition:background-color 0.3s}
        #timer-bar-fill.warning{background:#F44336;box-shadow:0 0 15px rgba(244,67,54,0.8);animation:timerPulse 0.4s ease-in-out infinite}
        @keyframes timerPulse{0%,100%{opacity:1}50%{opacity:0.3}}
        #timeout-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(244,67,54,0.95);display:flex;justify-content:center;align-items:center;z-index:9998;opacity:0;pointer-events:none;transition:opacity 0.15s}
        #timeout-overlay.active{opacity:1}
        #timeout-overlay .timeout-text{font-family:'Bebas Neue',sans-serif;font-size:48px;color:#fff;letter-spacing:3px;text-align:center;text-shadow:0 4px 20px rgba(0,0,0,.5);line-height:1}
        
        /* ====== PIEZA 2: INTERSTICIALES ====== */
        #intersticial-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;display:flex;justify-content:center;align-items:center;z-index:9997;opacity:0;pointer-events:none;transition:opacity 0.2s;padding:30px}
        #intersticial-overlay.active{opacity:1;pointer-events:all}
        #intersticial-text{font-family:'Bebas Neue',sans-serif;font-size:36px;text-align:center;line-height:1.1;letter-spacing:2px;max-width:320px}
        .inter-provocador{color:#E8FF00;animation:interShake 0.4s ease-in-out}
        .inter-sincero{color:#888;animation:interFadeIn 0.6s ease}
        .inter-absurdo{color:#fff;animation:interGlitch 0.5s ease}
        .inter-criptico{color:#E8FF00;animation:interPulse 2s ease-in-out infinite}
        .inter-dato{color:#4CAF50}
        @keyframes interShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
        @keyframes interFadeIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes interGlitch{0%{text-shadow:2px 0 #ff0000,-2px 0 #00ffff;transform:skewX(-2deg)}25%{text-shadow:-2px 0 #ff0000,2px 0 #00ffff;transform:skewX(2deg)}50%{text-shadow:1px 0 #ff0000,-1px 0 #00ffff;transform:skewX(-1deg)}75%{text-shadow:-1px 0 #ff0000,1px 0 #00ffff;transform:skewX(1deg)}100%{text-shadow:none;transform:skewX(0)}}
        @keyframes interPulse{0%,100%{opacity:0.4}50%{opacity:1}}
        
        /* ====== PIEZA 4: CONFESIONARIO ====== */
        .conf-input{width:100%;padding:18px;background:rgba(20,20,20,.9);border:2px solid #333;border-radius:12px;color:#fff;font-size:18px;font-weight:600;text-align:center;margin-bottom:10px;animation:confPulse 3s ease-in-out infinite}
        .conf-input:focus{outline:none;border-color:#E8FF00;animation:none}
        .conf-input::placeholder{color:#444;font-weight:500}
        @keyframes confPulse{0%,100%{border-color:#333}50%{border-color:#555}}
        .conf-burn{animation:burnText 0.8s ease-out forwards}
        @keyframes burnText{0%{opacity:1;filter:blur(0);color:#fff;transform:translateY(0)}30%{color:#ff8c00}60%{color:#ff4500;filter:blur(2px);transform:translateY(-5px)}100%{opacity:0;filter:blur(8px);color:transparent;transform:translateY(-20px)}}
        .conf-saved{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#555;letter-spacing:4px;opacity:0;animation:confSavedIn 0.3s ease forwards}
        @keyframes confSavedIn{0%{opacity:0}100%{opacity:1}}
    </style>
</head>
<body>
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="background.mp4" type="video/mp4">
        <source src="background.MOV" type="video/quicktime">
    </video>
    
    <div id="timer-bar-wrap"><div id="timer-bar-fill"></div></div>

    <div id="splash">
        <div class="splash-logo">BRUTAL</div>
        <div class="splash-sub">The Insight Club</div>
        <div id="splash-contract" class="splash-contract"></div>
        <div class="splash-info" id="splash-info"><strong>20</strong> preguntas · <strong>~3 min</strong></div>
        <button class="splash-enter" id="splash-btn" disabled onclick="initDrop()">ENTRAR</button>
        <div class="splash-error" id="splash-error" style="display:none"></div>
    </div>
    
    <div id="floating-hud">
        <div class="hud-side cash-side" id="box-cash"><span class="hud-val" id="val-cash">$0.00</span></div>
        <div class="hud-center"><div class="progress-track" id="pbar"></div></div>
        <div class="hud-side ticket-side" id="box-tix">
            <span class="hud-val" id="val-tix">0</span>
            <img src="golden_ticket_3d.png" class="hud-icon-img" alt="T">
        </div>
    </div>
    
    <div id="blink-fx"></div>
    <div id="timeout-overlay"><div class="timeout-text">BRUTAL<br>ELIGIÓ<br>POR VOS</div></div>
    <div id="intersticial-overlay"><div id="intersticial-text"></div></div>
    
    <div id="card-container"></div>

<script>
const API_URL=window.location.origin;
let D=[];
let dropSlug='';
let ci=0,cash=0,tix=0,ct=0,dt=0,sid=null,ms=[],ro=[],rs=[],tgUser=null;
let slStep=-1;
let timerInterval=null,timerTimeout=null;
const DEFAULT_TIMERS={binary:8,split_image:10,slider:12,multi_select:12,rank:15,trap:6,trap_silent:6,confesionario:20};
const DEFAULT_CONTRACT="Esto es un experimento. No una encuesta. No un test. Hay marcas que pagan. Hay preguntas nuestras. No te decimos cuáles. Todo es anónimo. Solo vos sabés de vos.";

function typewriter(text,el,speed,callback){let i=0;el.textContent='';const iv=setInterval(()=>{el.textContent+=text[i];i++;if(i>=text.length){clearInterval(iv);if(callback)callback()}},speed)}

window.onload=async()=>{
    if(window.Telegram?.WebApp){const t=window.Telegram.WebApp;t.ready();t.expand();t.setHeaderColor('#000000');t.setBackgroundColor('#000000');if(t.initDataUnsafe?.user)tgUser=t.initDataUnsafe.user}
    try{
        const r=await fetch(API_URL+'/api/drop/active');
        if(!r.ok)throw new Error('No active drop');
        const drop=await r.json();
        D=drop.cards;
        dropSlug=drop.slug||drop.id;
        document.getElementById('splash-info').innerHTML='<strong>'+D.length+'</strong> preguntas · <strong>~3 min</strong>';
        const contractText=(drop.splash_text&&drop.splash_text.contract)||DEFAULT_CONTRACT;
        setTimeout(()=>{typewriter(contractText,document.getElementById('splash-contract'),30,()=>{document.getElementById('splash-btn').disabled=false})},500);
    }catch(e){
        console.error('Failed to load drop:',e);
        document.getElementById('splash-error').style.display='block';
        document.getElementById('splash-error').textContent='No hay un Drop activo. Volvé más tarde.';
        document.getElementById('splash-contract').textContent='';
    }
};

async function initDrop(){
    if(D.length===0)return;
    hapHeavy();
    const sp=document.getElementById('splash');sp.classList.add('hide');
    setTimeout(()=>sp.style.display='none',500);
    document.getElementById('floating-hud').classList.add('visible');
    const pb=document.getElementById('pbar');
    for(let i=0;i<D.length;i++){const l=document.createElement('div');l.className='step-led';pb.appendChild(l)}
    try{
        const r=await fetch(API_URL+'/api/session/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_user:tgUser||{id:0},drop_id:dropSlug,device:{platform:window.Telegram?.WebApp?.platform||'unknown',version:window.Telegram?.WebApp?.version||'unknown'}})});
        const j=await r.json();
        if(r.status===409){alert(j.message||'Ya jugaste este Drop');window.Telegram?.WebApp?.close();return}
        sid=j.session_id;
    }catch(e){console.error('Session start failed:',e);sid='local_'+Date.now()}
    dt=Date.now();updHUD();render(0);
}

function hapLight(){window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light')}
function hapMedium(){window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('medium')}
function hapHeavy(){window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('heavy')}
function hapErr(){window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('error')}
function hapOk(){window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('success')}
function hapSel(){window.Telegram?.WebApp?.HapticFeedback?.selectionChanged()}
function hapSl(v,mn,mx){const s=Math.floor((v-mn)/((mx-mn)/20));if(s!==slStep){slStep=s;hapSel()}}

function clearTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}if(timerTimeout){clearTimeout(timerTimeout);timerTimeout=null}}
function startTimer(d){
    clearTimer();const fill=document.getElementById('timer-bar-fill');if(!fill)return;
    const duration=(d.timer||DEFAULT_TIMERS[d.f]||10)*1000;const startTime=Date.now();
    let warnedAt25=false,warned3=false,warned2=false,warned1=false;
    fill.style.transition='none';fill.style.width='100%';fill.classList.remove('warning');
    ct=Date.now();
    timerInterval=setInterval(()=>{
        const elapsed=Date.now()-startTime;const remaining=duration-elapsed;const pct=Math.max(0,(remaining/duration)*100);
        fill.style.width=pct+'%';
        if(pct<=25&&!warnedAt25){warnedAt25=true;fill.classList.add('warning')}
        const remSec=Math.ceil(remaining/1000);
        if(remSec<=3&&remSec>=1){if(remSec===3&&!warned3){warned3=true;hapSel()}if(remSec===2&&!warned2){warned2=true;hapSel()}if(remSec===1&&!warned1){warned1=true;hapSel()}}
        if(remaining<=0){clearTimer();fill.style.width='0%';handleTimeout(d,duration)}
    },50);
}
function handleTimeout(d,duration){
    hapErr();setTimeout(()=>hapHeavy(),100);rec(d.id,d.f,'timeout',null,duration);
    const overlay=document.getElementById('timeout-overlay');overlay.classList.add('active');
    setTimeout(()=>{overlay.classList.remove('active');const inner=document.getElementById('card-inner');if(inner)inner.classList.add('anim-out');setTimeout(()=>{render(ci+1)},300)},1000);
}

function rec(cardId,fmt,val,trap=null,overrideLatency=null){
    const lat=overrideLatency!==null?overrideLatency:Date.now()-ct;
    const row={session_id:sid,card_id:cardId,card_format:fmt,response_value:val,latency_ms:lat,trap_passed:trap};
    if(sid&&!sid.startsWith('local_')){fetch(API_URL+'/api/response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)}).catch(e=>console.error('Save failed:',e))}
    console.log('REC:',row);
}

function render(i){
    ci=i;const c=document.getElementById('card-container');const d=D[i];
    if(!d){renderReceipt(c);return}
    ct=Date.now();slStep=-1;
    const isConf=d.f==='confesionario';
    document.getElementById('bg-video').style.opacity=isConf?'0':'0.4';
    c.style.background=isConf?'#000':'transparent';
    if(!isConf){const hud=document.getElementById('floating-hud');hud.style.transition='opacity 0.5s';hud.style.opacity='1'}
    let h='<div id="card-inner">';
    h+='<div class="cn anim-in">'+(i+1)+' / '+D.length+'</div>';
    if(d.f!=='confesionario'){h+='<div class="cq anim-in">'+d.q+'</div>'}
    
    switch(d.f){
        case 'binary':h+='<div class="bc">';d.o.forEach((o,j)=>{h+='<button class="tb anim-in d'+(j+1)+'" onclick="hBin(\''+d.id+'\',\''+o.id+'\',this,\''+d.r.t+'\','+d.r.m+')">'+o.l+'</button>'});h+='</div>';break;
        case 'multi_select':ms=[];h+='<div class="bc">';d.o.forEach((o,j)=>{h+='<button id="ms-'+o.id+'" class="tb anim-in d'+Math.min(j+1,4)+'" onclick="tMS(\''+o.id+'\')">'+o.l+'</button>'});h+='</div><button id="msc" class="cb anim-in d4" disabled onclick="hMS(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')">Confirmar</button>';break;
        case 'slider':const mid=Math.round((d.c.max+d.c.min)/2);h+='<div class="slc anim-in d1"><div class="sv" id="svd">'+mid+'</div><input type="range" id="sli" min="'+d.c.min+'" max="'+d.c.max+'" value="'+mid+'" step="1" oninput="updSl(this.value,'+d.c.min+','+d.c.max+')"><div class="sll"><span>'+d.c.lb[0]+'</span><span>'+d.c.lb[1]+'</span></div></div><button class="cb anim-in d2" onclick="hSl(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')">Confirmar</button>';break;
        case 'split_image':h+='<div class="sic anim-in d1">';d.o.forEach(o=>{h+='<div class="io" onclick="hImg(\''+d.id+'\',\''+o.id+'\',this,\''+d.r.t+'\','+d.r.m+')"><img src="'+o.img+'" loading="eager"><div class="il">'+o.l+'</div></div>'});h+='</div>';break;
        case 'rank':ro=[...d.o];rs=[];h+='<div class="rzt anim-in d1" id="rkt"></div><div class="rzb anim-in d2" id="rkb"></div><button id="rkc" class="cb anim-in d3" disabled onclick="hRk(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')">Confirmar Orden</button>';break;
        case 'trap':h+='<div class="bc">';d.o.forEach((o,j)=>{h+='<button class="tb anim-in d'+(j+1)+'" onclick="hTrap(\''+d.id+'\',\''+o.id+'\',\''+d.tt+'\','+d.ip+','+d.r.m+','+d.p.m+')">'+o.l+'</button>'});h+='</div>';break;
        case 'trap_silent':h+='<div class="bc">';d.o.forEach((o,j)=>{h+='<button class="tb anim-in d'+(j+1)+'" onclick="hTS(\''+d.id+'\',\''+o.id+'\',\''+d.r.t+'\','+d.r.m+')">'+o.l+'</button>'});h+='</div>';break;
        case 'confesionario':const hud=document.getElementById('floating-hud');hud.style.transition='opacity 0.5s';hud.style.opacity='0';h+='<div class="cq" id="conf-q" style="opacity:0;margin-bottom:10px"></div>';h+='<input type="text" class="conf-input anim-in d2" id="cinp" placeholder="Escribí acá..." autocomplete="off" maxlength="100" style="opacity:0">';h+='<button class="cb anim-in d3" id="conf-btn" onclick="hConf(\''+d.id+'\',\''+d.r.t+'\','+d.r.m+')" style="opacity:0">Enviar</button>';break;
    }
    h+='</div>';c.innerHTML=h;void c.offsetWidth;
    if(d.f==='rank')updRk();
    if(d.f==='confesionario'){
        setTimeout(()=>{const qEl=document.getElementById('conf-q');if(!qEl)return;qEl.style.transition='opacity 0.3s';qEl.style.opacity='1';typewriter(d.q,qEl,30,()=>{const inp=document.getElementById('cinp');const btn=document.getElementById('conf-btn');if(inp){inp.style.transition='opacity 0.3s';inp.style.opacity='1'}if(btn){btn.style.transition='opacity 0.3s';btn.style.opacity='1'}setTimeout(()=>document.getElementById('cinp')?.focus(),200);startTimer(d)})},800);
    }else{setTimeout(()=>startTimer(d),100)}
}

function hBin(cid,oid,btn,rt,rm){clearTimer();hapLight();btn.classList.add('sel');rec(cid,'binary',oid);reward(rt,rm);adv(600)}
function hImg(cid,oid,el,rt,rm){clearTimer();hapLight();el.classList.add('sel');rec(cid,'split_image',oid);reward(rt,rm);adv(600)}
function tMS(id){hapLight();const b=document.getElementById('ms-'+id);if(ms.includes(id)){ms=ms.filter(x=>x!==id);b.classList.remove('sel')}else{ms.push(id);b.classList.add('sel')}document.getElementById('msc').disabled=ms.length===0}
function hMS(cid,rt,rm){clearTimer();hapMedium();rec(cid,'multi_select',[...ms]);reward(rt,rm);adv(500)}
function updSl(v,mn,mx){document.getElementById('svd').textContent=v;hapSl(v,mn,mx)}
function hSl(cid,rt,rm){clearTimer();hapMedium();rec(cid,'slider',parseInt(document.getElementById('sli').value));reward(rt,rm);adv(500)}
function hRk(cid,rt,rm){clearTimer();hapMedium();rec(cid,'rank',rs.map(o=>o.id));reward(rt,rm);adv(500)}
function hTrap(cid,sel,tgt,isP,rm,pm){clearTimer();let ok=isP?(sel!==tgt):(sel===tgt);rec(cid,'trap',sel,ok);if(ok){hapOk();reward('tickets',rm);adv(600)}else{hapErr();tix+=pm;updHUD();blink(pm,'tickets',false);adv(700)}}
function hTS(cid,sel,rt,rm){clearTimer();hapLight();rec(cid,'trap_silent',sel,null);reward(rt,rm);adv(600)}
function hConf(cid,rt,rm){const inp=document.getElementById('cinp');const v=inp.value.trim();if(!v){inp.style.borderColor='#F44336';return}clearTimer();hapMedium();rec(cid,'confesionario',v);reward(rt,rm);inp.classList.add('conf-burn');const confBtn=document.getElementById('conf-btn');if(confBtn)confBtn.style.display='none';setTimeout(()=>{inp.style.display='none';const saved=document.createElement('div');saved.className='conf-saved';saved.textContent='GUARDADO';const inner=document.getElementById('card-inner');if(inner)inner.appendChild(saved);setTimeout(()=>{const hud=document.getElementById('floating-hud');hud.style.opacity='1';adv(300)},500)},800)}

function tapRk(id){hapLight();if(rs.find(s=>s.id===id))rs=rs.filter(s=>s.id!==id);else rs.push(ro.find(o=>o.id===id));updRk()}
function updRk(){const t=document.getElementById('rkt'),b=document.getElementById('rkb'),c=document.getElementById('rkc');t.innerHTML=rs.map((o,i)=>'<div class="ri p'+i+'" onclick="tapRk(\''+o.id+'\')"> #'+(i+1)+' — '+o.l+'</div>').join('');b.innerHTML=ro.filter(o=>!rs.find(s=>s.id===o.id)).map(o=>'<div class="ri" onclick="tapRk(\''+o.id+'\')">'+o.l+'</div>').join('');c.disabled=rs.length!==ro.length}

function reward(t,m){if(t==='tickets'){tix+=m;blink(m,'tickets',true);bump('box-tix')}else{cash+=m;blink(m,'cash',true);bump('box-cash')}updHUD()}
function adv(dl){clearTimer();led(ci);const d=D[ci];const inner=document.getElementById('card-inner');if(inner)inner.classList.add('anim-out');if(d&&d.intersticial){setTimeout(()=>{showIntersticial(d.intersticial,()=>{render(ci+1)})},dl)}else{setTimeout(()=>render(ci+1),dl)}}
function showIntersticial(inter,callback){const overlay=document.getElementById('intersticial-overlay');const textEl=document.getElementById('intersticial-text');textEl.textContent=inter.texto;textEl.className='inter-'+inter.tipo;overlay.classList.add('active');hapSel();setTimeout(()=>{overlay.classList.remove('active');setTimeout(callback,200)},2000)}
function updHUD(){document.getElementById('val-cash').textContent='$'+cash.toFixed(2);document.getElementById('val-tix').textContent=tix}
function bump(id){const e=document.getElementById(id);e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),150)}
function led(i){const l=document.querySelectorAll('.step-led');if(!l[i])return;const h=240-(i/(D.length-1)*240);const col='hsl('+h+',100%,50%)';l[i].classList.add('active');l[i].style.backgroundColor=col;l[i].style.color=col}
function blink(m,t,pos){const f=document.getElementById('blink-fx');let tx=t==='cash'?(pos?'+$'+m.toFixed(2):'-$'+Math.abs(m).toFixed(2)):(pos?'+'+m:''+m);f.innerHTML=t==='tickets'?'<span style="display:flex;align-items:center;gap:10px">'+tx+' <img src="golden_ticket_3d.png" style="width:50px"></span>':tx;f.classList.remove('blink-g','blink-r');void f.offsetWidth;f.classList.add(pos?'blink-g':'blink-r')}

function renderReceipt(c){clearTimer();document.getElementById('floating-hud').style.display='none';document.getElementById('bg-video').style.opacity='.3';const dur=Math.round((Date.now()-dt)/1000);const min=Math.floor(dur/60);const sec=dur%60;c.innerHTML='<div class="rc anim-in"><div class="rt">DROP COMPLETADO</div><div class="rv">$'+cash.toFixed(2)+'</div><div class="rtb"><img src="golden_ticket_3d.png" style="width:40px"><div class="rtv">'+tix+' tickets</div></div><div class="rs">Tiempo: '+min+'m '+sec+'s</div><button class="rcl" id="clbtn" onclick="finish()">RECLAMAR TODO</button></div>'}
async function finish(){const btn=document.getElementById('clbtn');btn.textContent='ENVIANDO...';btn.classList.add('sending');if(sid&&!sid.startsWith('local_')){try{await fetch(API_URL+'/api/session/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,totals:{cash,tickets:tix,trap_score:0,trap_total:0,duration_ms:Date.now()-dt}})})}catch(e){console.error(e)}}hapOk();btn.textContent='✓ RECLAMADO';btn.style.background='#E8FF00';btn.style.color='#000';setTimeout(()=>{window.Telegram?.WebApp?.close()},1200)}
</script>
</body>
</html>
